apiVersion: apps/v1
kind: Deployment

metadata:
  name: hostel-management

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hostel-management

  template:
    metadata:
      labels:
        app: hostel-management

    spec:
      containers:
        - name: hostel-container
          image: hostel-management:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
